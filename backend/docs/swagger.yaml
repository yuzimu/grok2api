basePath: /
definitions:
  httpserver.SwaggerChatRequest:
    properties:
      messages:
        items:
          $ref: '#/definitions/httpserver.SwaggerMessage'
        type: array
      model:
        example: grok-chat-fast
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerImageEditRequest:
    properties:
      aspect_ratio:
        example: "1:1"
        type: string
      image:
        $ref: '#/definitions/httpserver.SwaggerImageReference'
      model:
        example: grok-imagine-image-2.0-web
        type: string
      "n":
        example: 1
        type: integer
      partial_images:
        example: 0
        type: integer
      prompt:
        example: Change the background to black
        type: string
      quality:
        example: medium
        type: string
      resolution:
        example: 1k
        type: string
      response_format:
        example: url
        type: string
      size:
        example: 1024x1024
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerImageGenerationRequest:
    properties:
      aspect_ratio:
        example: "16:9"
        type: string
      model:
        example: grok-imagine-image-quality
        type: string
      "n":
        example: 1
        type: integer
      partial_images:
        example: 0
        type: integer
      prompt:
        example: A cinematic city at night
        type: string
      resolution:
        example: 2k
        type: string
      response_format:
        example: url
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerImageLayerRequest:
    properties:
      image:
        $ref: '#/definitions/httpserver.SwaggerImageReference'
      model:
        example: grok-imagine-image-2.0-web
        type: string
    type: object
  httpserver.SwaggerImageReference:
    properties:
      url:
        example: https://example.com/source.png
        type: string
    type: object
  httpserver.SwaggerMessage:
    properties:
      content: {}
      role:
        example: user
        type: string
    type: object
  httpserver.SwaggerMessagesRequest:
    properties:
      max_tokens:
        example: 1024
        type: integer
      messages:
        items:
          $ref: '#/definitions/httpserver.SwaggerMessage'
        type: array
      model:
        example: grok-chat-expert
        type: string
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerResponsesRequest:
    properties:
      input: {}
      model:
        example: grok-chat-auto
        type: string
      previous_response_id:
        type: string
      prompt_cache_key:
        type: string
      store:
        example: false
        type: boolean
      stream:
        example: false
        type: boolean
    type: object
  httpserver.SwaggerVideoAudioInput:
    properties:
      data:
        example: SUQzBAAAAAAA...
        type: string
      format:
        example: mp3
        type: string
      url:
        example: https://example.com/reference.mp3
        type: string
      voice_id:
        example: eve
        type: string
    type: object
  httpserver.SwaggerVideoGenerationRequest:
    properties:
      aspect_ratio:
        example: "16:9"
        type: string
      duration:
        example: 8
        type: integer
      image:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
      input_reference:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
      last_frame:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
      model:
        example: grok-imagine-video-1.5
        type: string
      prompt:
        example: A cinematic tracking shot in the rain
        type: string
      reference_audios:
        items:
          $ref: '#/definitions/httpserver.SwaggerVideoAudioInput'
        type: array
      reference_images:
        items:
          $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
        type: array
      resolution:
        example: 720p
        type: string
      seconds:
        example: "8"
        type: string
      size:
        example: 1280x720
        type: string
      video:
        $ref: '#/definitions/httpserver.SwaggerVideoMediaInput'
      video_extension_start_time:
        example: 6.041667
        type: number
    type: object
  httpserver.SwaggerVideoMediaInput:
    properties:
      file_id:
        example: file_123
        type: string
      url:
        example: https://example.com/input.png
        type: string
    type: object
info:
  contact: {}
  description: Grok Build 与 Grok Web 多账号 API 网关。
  title: Grok2API
  version: "1.0"
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 存活检查
      tags:
      - System
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: boolean
            type: object
      summary: 就绪检查
      tags:
      - System
  /v1/chat/completions:
    post:
      consumes:
      - application/json
      description: 支持 JSON 与 SSE、图片输入和函数工具。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Chat Completion
      tags:
      - Chat
  /v1/images/edits:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: 支持原 JSON image/images URL 对象（包括 data URL），或 multipart 的 image/image[]
        文件。multipart 标量 n、stream、partial_images 等进入同一业务校验；selection_regions/multi_region_edits
        使用 JSON 表单值。每文件最多 20 MiB，multipart 总计最多 32 MiB、64 段，且不超过服务端请求体限制。n 仅支持 1，quality
        仅支持 low/medium。mask、background、input_fidelity、output_format、output_compression、user
        不支持并明确报错。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerImageEditRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 编辑图片
      tags:
      - Images
  /v1/images/generations:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerImageGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 生成图片
      tags:
      - Images
  /v1/images/layers:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerImageLayerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 识别图片分层
      tags:
      - Images
  /v1/media/images/{asset_id}:
    get:
      description: 无需 API Key 或 Cookie，可直接下载。
      parameters:
      - description: Asset ID
        in: path
        name: asset_id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
      summary: 获取归档图片
      tags:
      - Images
  /v1/messages:
    post:
      consumes:
      - application/json
      parameters:
      - default: "2023-06-01"
        description: Anthropic API version
        in: header
        name: anthropic-version
        required: true
        type: string
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerMessagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Anthropic Message
      tags:
      - Messages
  /v1/models:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取可用模型
      tags:
      - Models
  /v1/responses:
    post:
      consumes:
      - application/json
      description: 支持 JSON 与 SSE；stream=true 时返回 text/event-stream。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerResponsesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建 Response
      tags:
      - Responses
  /v1/responses/{response_id}:
    delete:
      parameters:
      - description: Response ID
        in: path
        name: response_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除 Response
      tags:
      - Responses
    get:
      parameters:
      - description: Response ID
        in: path
        name: response_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询 Response
      tags:
      - Responses
  /v1/responses/compact:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerResponsesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 压缩 Response 上下文
      tags:
      - Responses
  /v1/videos:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: JSON 和 multipart 共用校验。seconds（整数字符串或整数）映射 duration；size 支持 1280x720、720x1280、1920x1080、1080x1920，映射
        resolution/aspect_ratio，冲突时报错。multipart input_reference 仅支持图片文件，JSON 使用与 image
        相同的 url/file_id 对象；与 image 不能同时提供。每文件最多 20 MiB，multipart 总计最多 32 MiB、64 段，且不超过服务端请求体限制。保留原
        reference_images/last_frame/reference_audios 字段；结构化表单值使用 JSON。POST /v1/videos
        返回标准 video 对象，扩展创建路径返回 request_id。GET 返回标准 queued/in_progress/completed/failed
        状态与任务真实元数据，完成时保留 video.url 和 content_url。无视频 list/delete/cancel 接口。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerVideoGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建异步视频任务
      tags:
      - Videos
  /v1/videos/{request_id}:
    get:
      parameters:
      - description: Request ID
        in: path
        name: request_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 查询异步视频任务
      tags:
      - Videos
  /v1/videos/{request_id}/content:
    get:
      description: 无需 API Key 或 Cookie；本地视频支持 Range 分段读取。
      parameters:
      - description: Request ID
        in: path
        name: request_id
        required: true
        type: string
      produces:
      - video/mp4
      responses:
        "200":
          description: OK
          schema:
            type: file
        "206":
          description: Partial Content
          schema:
            type: file
        "404":
          description: Not Found
      summary: 直接下载已完成视频
      tags:
      - Videos
    head:
      description: 无需 API Key 或 Cookie，不返回文件正文。
      parameters:
      - description: Request ID
        in: path
        name: request_id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
      summary: 读取已完成视频的下载响应头
      tags:
      - Videos
  /v1/videos/edits:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerVideoGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建异步视频编辑任务
      tags:
      - Videos
  /v1/videos/extensions:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerVideoGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建异步视频延长任务
      tags:
      - Videos
  /v1/videos/generations:
    post:
      consumes:
      - application/json
      - multipart/form-data
      description: JSON 和 multipart 共用校验。seconds（整数字符串或整数）映射 duration；size 支持 1280x720、720x1280、1920x1080、1080x1920，映射
        resolution/aspect_ratio，冲突时报错。multipart input_reference 仅支持图片文件，JSON 使用与 image
        相同的 url/file_id 对象；与 image 不能同时提供。每文件最多 20 MiB，multipart 总计最多 32 MiB、64 段，且不超过服务端请求体限制。保留原
        reference_images/last_frame/reference_audios 字段；结构化表单值使用 JSON。POST /v1/videos
        返回标准 video 对象，扩展创建路径返回 request_id。GET 返回标准 queued/in_progress/completed/failed
        状态与任务真实元数据，完成时保留 video.url 和 content_url。无视频 list/delete/cancel 接口。
      parameters:
      - description: 请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpserver.SwaggerVideoGenerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 创建异步视频任务
      tags:
      - Videos
securityDefinitions:
  BearerAuth:
    description: 使用 "Bearer g2a_xxx_xxx"。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
